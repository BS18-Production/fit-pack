name: fit_pack
description: "Fitness tracking app - workout, nutrition, body metrics"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Çok dilli destek (docs/14 — i18n/l10n)
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Storage
  shared_preferences: ^2.3.4

  # Antrenman ekranını uyanık tut (docs/12)
  wakelock_plus: ^1.2.8

  # Yedek geri yükleme dosya seçimi (docs/12 veri güvenliği)
  file_picker: ^8.1.6

  # Bulut yedek + hesap (docs/13 — Supabase)
  supabase_flutter: ^2.8.0

  # Routing
  go_router: ^14.8.1

  # Charts
  fl_chart: ^0.70.2

  # UI
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Utils
  share_plus: ^10.1.4
  csv: ^6.0.0

  # Beslenme V2 — OpenFoodFacts (REST) + barkod tarama (docs/07-nutrition-v2.md)
  http: ^1.2.0
  mobile_scanner: ^7.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Test (Testing §4)
  mocktail: ^1.0.4

  # Drift code generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

  # Uygulama ikonu üretimi (P-15 — "Yükseliş" Işıyan ikon)
  flutter_launcher_icons: ^0.14.3

# P-15: Marka ikonu. Kaynak 1024px PNG'ler assets/icon/ (Claude Design
# "Yükseliş" varyant A — koyu radial zemin + ışıyan chevron + teal spark).
# Değiştirmek için: assets/icon/* güncelle → dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_full.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true

  # docs/14 — ARB dosyalarından AppL10n üret (l10n.yaml yapılandırır)
  generate: true

  assets:
    - assets/data/
    - assets/images/
    - assets/icons/
    - assets/maps/

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    input, button, textarea { font-family: 'Inter', system-ui, sans-serif; }
    input:focus, textarea:focus { outline: none; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    @keyframes fpFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fpSlide { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fpUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes fpPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes fpBanner { from { transform: translateY(-120%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</helmet>

<div style="min-width:100%; min-height:100vh; box-sizing:border-box; padding:44px 64px 64px; background:#e7e5df; font-family:'Inter',system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; gap:20px;">
  <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center; align-items:center;">
    <div style="display:flex; background:rgba(16,18,24,0.06); border-radius:99px; padding:4px; gap:2px;">
      <button onClick="{{ setLight }}" style="{{ segLight }}">Açık</button>
      <button onClick="{{ setDark }}" style="{{ segDark }}">Koyu</button>
    </div>
    <div style="font-size:12.5px; font-weight:600; color:#83807a;">{{ hint }}</div>
  </div>
  <x-import component="IOSDevice" from="./ios-frame.jsx" dark="{{ dark }}" hint-size="402px,874px">{{ app }}</x-import>
</div>
</x-dc>

  componentDidMount(){
    this.timer = setInterval(()=>{
      const s=this.state;
      if(s.session){ this.setState({now:Date.now()}); }
      if(s.rest && s.rest.remaining>0){
        this.setState(st=>{ if(!st.rest) return {}; const rem=st.rest.remaining-1; return {rest: rem<=0? null : {...st.rest, remaining:rem}}; });
      }
    }, 1000);
  }
  componentWillUnmount(){ clearInterval(this.timer); }

  // ---------- helpers ----------
  th(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
  fmt(n){ const v=Math.round(n*10)/10; return (v%1===0? v.toString() : v.toString().replace('.',',')); }
  clock(s){ const m=Math.floor(s/60), sec=s%60; return m+':'+(sec<10?'0':'')+sec; }
  clockH(s){ const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; return (h>0?h+':'+(m<10?'0':''):'')+m+':'+(sec<10?'0':'')+sec; }
  ex(id){ return this.LIB.find(e=>e.id===id); }
  e1rm(kg,reps){ return kg*(1+reps/30); }

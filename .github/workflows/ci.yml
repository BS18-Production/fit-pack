# Her gönderimde yerel kapıyla aynı kontroller (docs/06 §6).
# Yerel kontroller kalkmadı; bu, unutulan bir adımı yakalayan ikinci ağ.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Gecelik iOS derlemesi (03:30 TSİ). macOS koşucusu dakikayı 10x saydığı
    # için her push'ta değil — iOS'un sessizce bozulmasına karşı sigorta.
    - cron: '30 0 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - run: flutter pub get

      # Üretilen dosyalar (drift .g.dart, l10n) repoda takipli — analyze
      # bunları olduğu gibi kullanır, CI'da yeniden üretilmez.
      - run: flutter analyze

      # drift/sqlite3 testleri yerel kütüphaneye bağlı (macOS'ta hazır gelir).
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - run: flutter test

      - name: Doküman tutarlılığı (docs/06 §10)
        run: python3 tools/check_docs.py

  # Android tarafı derleniyor mu (Kotlin servisleri, manifest, Gradle) —
  # Dart testleri bunları hiç derlemiyor (CR-020).
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --debug

  # Sunucu fonksiyonu: tip kontrolü + handler testleri (CR-020).
  # SQL/RLS testleri (supabase/tests) yerel Supabase yığını ister — şimdilik
  # yalnız Dev'de elle çalışır (supabase/tests/README.md).
  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/ask-route
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno task check

      - run: deno task test

  # Yalnız gecelik/elle: iOS tarafı derleniyor mu (imzasız).
  ios-build:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --no-codesign

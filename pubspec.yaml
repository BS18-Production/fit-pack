name: fit_pack
description: "Fitness tracking app - workout, nutrition, body metrics"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Storage
  shared_preferences: ^2.3.4

  # Routing
  go_router: ^14.8.1

  # Charts
  fl_chart: ^0.70.2

  # UI
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1
  intl: ^0.20.2

  # Utils
  uuid: ^4.5.1
  share_plus: ^10.1.4
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/icons/
